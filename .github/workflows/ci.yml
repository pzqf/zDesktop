name: CI

# T1 层门禁（设计案 v3.1 §十）：纯逻辑测试，每次提交都跑。
# T1 红 → 阻断合入。T2（真机脚本）/ T3（人工清单）在发版前本地执行。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # WPF + Win32 互操作，必须在 Windows runner 上构建
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore zDesktop.sln

      - name: 构建（Release，警告即错误）
        # 仓库当前是零警告状态，用 -warnaserror 守住这条线
        run: dotnet build zDesktop.sln -c Release --no-restore -warnaserror

      - name: T1 测试
        run: dotnet test tests/zDesktop.Tests/zDesktop.Tests.csproj -c Release --no-build --verbosity normal
