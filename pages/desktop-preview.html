<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面效果图</title>
    <style id="theme-vars">
:root {
  /* Brand Colors */
  --dt-background: #0f1117;
  --dt-foreground: #e8eaed;
  --dt-card: #1a1d27;
  --dt-card-foreground: #e8eaed;
  --dt-popover: #1a1d27;
  --dt-popover-foreground: #e8eaed;
  --dt-primary: #6c5ce7;
  --dt-primary-foreground: #ffffff;
  --dt-muted: #2a2d3a;
  --dt-muted-foreground: #9ca3af;
  --dt-border: #2e3142;
  --dt-input: #2a2d3a;
  --dt-ring: #6c5ce7;
  --dt-state-success: #10b981;
  --dt-state-warning: #f59e0b;
  --dt-state-error: #ef4444;
  --dt-state-info: #3b82f6;
  --dt-radius-sm: 6px;
  --dt-radius-md: 10px;
  --dt-radius-lg: 16px;
}

body {
  font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background-color: var(--dt-background);
  color: var(--dt-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--dt-background);
    --color-foreground: var(--dt-foreground);
    --color-card: var(--dt-card);
    --color-card-foreground: var(--dt-card-foreground);
    --color-popover: var(--dt-popover);
    --color-popover-foreground: var(--dt-popover-foreground);
    --color-primary: var(--dt-primary);
    --color-primary-foreground: var(--dt-primary-foreground);
    --color-muted: var(--dt-muted);
    --color-muted-foreground: var(--dt-muted-foreground);
    --color-border: var(--dt-border);
    --color-input: var(--dt-input);
    --color-ring: var(--dt-ring);
    --radius-sm: var(--dt-radius-sm);
    --radius-md: var(--dt-radius-md);
    --radius-lg: var(--dt-radius-lg);
  }
  @layer base {
    body { background: var(--dt-background); color: var(--dt-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--dt-background); }
      .text-background { color: var(--dt-background); }
      .border-background { border-color: var(--dt-background); }
      .ring-background { --tw-ring-color: var(--dt-background); }
      .bg-foreground { background-color: var(--dt-foreground); }
      .text-foreground { color: var(--dt-foreground); }
      .border-foreground { border-color: var(--dt-foreground); }
      .ring-foreground { --tw-ring-color: var(--dt-foreground); }
      .bg-card { background-color: var(--dt-card); }
      .text-card { color: var(--dt-card); }
      .border-card { border-color: var(--dt-card); }
      .ring-card { --tw-ring-color: var(--dt-card); }
      .bg-card-foreground { background-color: var(--dt-card-foreground); }
      .text-card-foreground { color: var(--dt-card-foreground); }
      .border-card-foreground { border-color: var(--dt-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--dt-card-foreground); }
      .bg-popover { background-color: var(--dt-popover); }
      .text-popover { color: var(--dt-popover); }
      .border-popover { border-color: var(--dt-popover); }
      .ring-popover { --tw-ring-color: var(--dt-popover); }
      .bg-popover-foreground { background-color: var(--dt-popover-foreground); }
      .text-popover-foreground { color: var(--dt-popover-foreground); }
      .border-popover-foreground { border-color: var(--dt-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--dt-popover-foreground); }
      .bg-primary { background-color: var(--dt-primary); }
      .text-primary { color: var(--dt-primary); }
      .border-primary { border-color: var(--dt-primary); }
      .ring-primary { --tw-ring-color: var(--dt-primary); }
      .bg-primary-foreground { background-color: var(--dt-primary-foreground); }
      .text-primary-foreground { color: var(--dt-primary-foreground); }
      .border-primary-foreground { border-color: var(--dt-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--dt-primary-foreground); }
      .bg-muted { background-color: var(--dt-muted); }
      .text-muted { color: var(--dt-muted); }
      .border-muted { border-color: var(--dt-muted); }
      .ring-muted { --tw-ring-color: var(--dt-muted); }
      .bg-muted-foreground { background-color: var(--dt-muted-foreground); }
      .text-muted-foreground { color: var(--dt-muted-foreground); }
      .border-muted-foreground { border-color: var(--dt-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--dt-muted-foreground); }
      .bg-border { background-color: var(--dt-border); }
      .text-border { color: var(--dt-border); }
      .border-border { border-color: var(--dt-border); }
      .ring-border { --tw-ring-color: var(--dt-border); }
      .bg-input { background-color: var(--dt-input); }
      .text-input { color: var(--dt-input); }
      .border-input { border-color: var(--dt-input); }
      .ring-input { --tw-ring-color: var(--dt-input); }
      .bg-ring { background-color: var(--dt-ring); }
      .text-ring { color: var(--dt-ring); }
      .border-ring { border-color: var(--dt-ring); }
      .ring-ring { --tw-ring-color: var(--dt-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="h-screen w-screen overflow-hidden relative">

      <!-- Wallpaper Background Layer — rich landscape gradient simulating a mountain lake wallpaper -->
      <div class="absolute inset-0" style="background: linear-gradient(180deg, #1a1a2e 0%, #16213e 15%, #0f3460 30%, #1a5276 45%, #2e86ab 55%, #48a9a6 62%, #6dc0ca 68%, #a8d8d0 75%, #d4e7c5 82%, #f0e68c 90%, #e8a87c 95%, #d63384 100%);"></div>
      <!-- Wallpaper photo overlay via img -->
      <img src="../assets/wallpaper-mountain-lake.jpg" alt="" class="absolute inset-0 w-full h-full object-cover" style="opacity: 0.95;" />
      <!-- Subtle vignette overlay for depth -->
      <div class="absolute inset-0" style="background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.35) 100%);"></div>
      <!-- Ambient brand glow for atmosphere (very subtle, non-intrusive) -->
      <div class="absolute inset-0 pointer-events-none" style="background: radial-gradient(circle at 8% 12%, rgba(108,92,231,0.10) 0%, transparent 32%), radial-gradient(circle at 92% 94%, rgba(108,92,231,0.07) 0%, transparent 28%);"></div>

      <!-- ========== Desktop Icons (top-left, grouped like real Windows) ========== -->
      <div class="absolute top-4 left-4 z-10 flex flex-col gap-0.5" style="max-height: calc(100vh - 80px);">
        <!-- System Shortcuts Group -->
        <div class="flex flex-col items-start mb-3">
          <div class="text-[10px] text-white/25 px-1.5 py-0.5 mb-1 tracking-wider" style="text-shadow: 0 1px 3px rgba(0,0,0,0.8);">快捷方式</div>
          <div class="flex flex-col flex-wrap gap-1" style="max-height: 180px;">
            <!-- 此电脑 (selected state) -->
            <div class="flex flex-col items-center w-[76px] p-1.5 rounded cursor-pointer bg-white/[0.08] border border-white/[0.14] hover:bg-white/[0.12] transition-colors" style="box-shadow: 0 0 0 1px rgba(108,92,231,0.10), inset 0 1px 0 rgba(255,255,255,0.04);">
              <div class="w-10 h-10 flex items-center justify-center">
                <i data-lucide="monitor" class="w-8 h-8 text-white" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));"></i>
              </div>
              <span class="text-[11px] text-white mt-0.5 text-center leading-tight" style="text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.7);">此电脑</span>
            </div>
            <!-- 回收站 -->
            <div class="flex flex-col items-center w-[76px] p-1.5 rounded cursor-pointer hover:bg-white/10 transition-colors">
              <div class="w-10 h-10 flex items-center justify-center">
                <i data-lucide="trash-2" class="w-8 h-8 text-white" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));"></i>
              </div>
              <span class="text-[11px] text-white mt-0.5 text-center leading-tight" style="text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.7);">回收站</span>
            </div>
          </div>
        </div>
        <!-- Documents Group -->
        <div class="flex flex-col items-start mb-3">
          <div class="text-[10px] text-white/25 px-1.5 py-0.5 mb-1 tracking-wider" style="text-shadow: 0 1px 3px rgba(0,0,0,0.8);">文档</div>
          <div class="flex flex-col flex-wrap gap-1" style="max-height: 180px;">
            <!-- 项目源码 -->
            <div class="flex flex-col items-center w-[76px] p-1.5 rounded cursor-pointer hover:bg-white/10 transition-colors">
              <div class="w-10 h-10 flex items-center justify-center">
                <i data-lucide="folder" class="w-8 h-8 text-amber-300" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));"></i>
              </div>
              <span class="text-[11px] text-white mt-0.5 text-center leading-tight truncate w-full px-1" style="text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.7);">项目源码</span>
            </div>
            <!-- 设计素材 -->
            <div class="flex flex-col items-center w-[76px] p-1.5 rounded cursor-pointer hover:bg-white/10 transition-colors">
              <div class="w-10 h-10 flex items-center justify-center">
                <i data-lucide="folder" class="w-8 h-8 text-amber-300" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));"></i>
              </div>
              <span class="text-[11px] text-white mt-0.5 text-center leading-tight truncate w-full px-1" style="text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.7);">设计素材</span>
            </div>
            <!-- 备份文件 -->
            <div class="flex flex-col items-center w-[76px] p-1.5 rounded cursor-pointer hover:bg-white/10 transition-colors">
              <div class="w-10 h-10 flex items-center justify-center">
                <i data-lucide="folder" class="w-8 h-8 text-amber-300" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));"></i>
              </div>
              <span class="text-[11px] text-white mt-0.5 text-center leading-tight truncate w-full px-1" style="text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.7);">备份文件</span>
            </div>
          </div>
        </div>
        <!-- Tools Group -->
        <div class="flex flex-col items-start">
          <div class="text-[10px] text-white/25 px-1.5 py-0.5 mb-1 tracking-wider" style="text-shadow: 0 1px 3px rgba(0,0,0,0.8);">工具</div>
          <div class="flex flex-col flex-wrap gap-1" style="max-height: 180px;">
            <!-- VS Code -->
            <div class="flex flex-col items-center w-[76px] p-1.5 rounded cursor-pointer hover:bg-white/10 transition-colors">
              <div class="w-10 h-10 flex items-center justify-center">
                <i data-lucide="code" class="w-8 h-8" style="color: #60a5fa; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));"></i>
              </div>
              <span class="text-[11px] text-white mt-0.5 text-center leading-tight truncate w-full px-1" style="text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.7);">VS Code</span>
            </div>
            <!-- 浏览器 -->
            <div class="flex flex-col items-center w-[76px] p-1.5 rounded cursor-pointer hover:bg-white/10 transition-colors">
              <div class="w-10 h-10 flex items-center justify-center">
                <i data-lucide="globe" class="w-8 h-8 text-white" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));"></i>
              </div>
              <span class="text-[11px] text-white mt-0.5 text-center leading-tight truncate w-full px-1" style="text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.7);">浏览器</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ========== Floating Search (top-right, compact) ========== -->
      <div data-dom-id="shortcut-global-search" class="absolute top-4 right-4 z-20" style="width: 240px;">
        <div class="flex items-center gap-2 px-3 h-8 rounded-lg bg-black/25 border border-white/10 cursor-pointer transition-colors hover:bg-black/35 hover:border-white/20" style="backdrop-filter: blur(20px) saturate(1.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);">
          <i data-lucide="search" class="w-3.5 h-3.5 text-white/40 shrink-0"></i>
          <span class="text-xs text-white/30 flex-1">搜索...</span>
          <span class="bg-white/10 text-white/40 text-[9px] px-1.5 py-0.5 rounded">Ctrl+Space</span>
        </div>
      </div>

      <!-- ========== Widget Panels (right side, below search) ========== -->
      <div class="absolute top-16 right-4 flex flex-col gap-3 z-10" style="width: 240px;">

        <!-- Clock & Weather Widget -->
        <div class="p-4 rounded-2xl bg-black/25 border border-white/10" style="backdrop-filter: blur(32px) saturate(1.5); box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);">
          <div class="flex items-start justify-between">
            <div>
              <div class="text-4xl font-extralight text-white tracking-wider tabular-nums" style="text-shadow: 0 2px 12px rgba(0,0,0,0.35), 0 0 24px rgba(255,255,255,0.06);">14:32:08</div>
              <div class="text-xs text-white/50 mt-1 font-light">7月22日 周二</div>
              <div class="text-[10px] text-white/35 mt-0.5">乙巳年 六月廿七</div>
            </div>
            <div class="flex flex-col items-center gap-1 mt-1">
              <div class="w-9 h-9 rounded-full flex items-center justify-center" style="background: radial-gradient(circle, rgba(251,191,36,0.18) 0%, transparent 70%);">
                <i data-lucide="cloud-sun" class="w-7 h-7 text-amber-200/85" style="filter: drop-shadow(0 0 6px rgba(251,191,36,0.4));"></i>
              </div>
              <span class="text-lg font-light text-white/80">28°</span>
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-white/5 flex items-center gap-1.5">
            <i data-lucide="map-pin" class="w-3 h-3 text-white/30 shrink-0"></i>
            <span class="text-[11px] text-white/40">多云 · 上海 · 湿度 68%</span>
          </div>
        </div>

        <!-- Mini Calendar Widget -->
        <div class="p-3 rounded-2xl bg-black/25 border border-white/10" style="backdrop-filter: blur(32px) saturate(1.5); box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);">
          <div class="text-xs text-white/60 mb-2 font-medium">7月 2026</div>
          <!-- Weekday headers -->
          <div class="grid grid-cols-7 gap-0.5 text-center mb-1">
            <span class="text-[8px] text-white/30">日</span>
            <span class="text-[8px] text-white/30">一</span>
            <span class="text-[8px] text-white/30">二</span>
            <span class="text-[8px] text-white/30">三</span>
            <span class="text-[8px] text-white/30">四</span>
            <span class="text-[8px] text-white/30">五</span>
            <span class="text-[8px] text-white/30">六</span>
          </div>
          <!-- Current week row (highlighted) — 19~25, today=22 -->
          <div class="grid grid-cols-7 gap-0.5 text-center py-1 rounded-md" style="background: rgba(255,255,255,0.05);">
            <span class="text-[9px] text-white/40 py-0.5">19</span>
            <span class="text-[9px] text-white/40 py-0.5">20</span>
            <span class="text-[9px] text-white/40 py-0.5">21</span>
            <span class="text-[9px] py-0.5 flex items-center justify-center">
              <span class="w-4 h-4 rounded-full flex items-center justify-center text-primary" style="background: var(--dt-primary); color: #fff;">22</span>
            </span>
            <span class="text-[9px] text-white/40 py-0.5">23</span>
            <span class="text-[9px] text-white/40 py-0.5">24</span>
            <span class="text-[9px] text-white/40 py-0.5">25</span>
          </div>
        </div>

        <!-- Quick Notes Widget -->
        <div class="p-4 rounded-2xl bg-black/25 border border-white/10" style="backdrop-filter: blur(32px) saturate(1.5); box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);">
          <div class="flex items-center justify-between mb-2.5">
            <div class="text-[11px] font-medium text-white/50 tracking-wide uppercase">便签</div>
            <div class="w-5 h-5 rounded flex items-center justify-center hover:bg-white/10 cursor-pointer transition-colors">
              <i data-lucide="plus" class="w-3 h-3 text-white/40"></i>
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <div class="p-2.5 rounded-lg text-xs text-white/90 leading-relaxed" style="background: rgba(245,158,11,0.12); border-left: 2px solid rgba(245,158,11,0.4);">
              周五提交 v2.0
            </div>
            <div class="p-2.5 rounded-lg text-xs text-white/90 leading-relaxed" style="background: rgba(108,92,231,0.12); border-left: 2px solid rgba(108,92,231,0.4);">
              记得备份设计稿
            </div>
          </div>
        </div>

        <!-- System Monitor Widget -->
        <div class="p-4 rounded-2xl bg-black/25 border border-white/10" style="backdrop-filter: blur(32px) saturate(1.5); box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);">
          <div class="text-[11px] font-medium text-white/50 tracking-wide uppercase mb-3">系统监控</div>
          <div class="flex flex-col gap-2.5">
            <div>
              <div class="flex justify-between items-center mb-1">
                <span class="text-[11px] text-white/50">CPU</span>
                <span class="text-[11px] text-white/70 tabular-nums">32%</span>
              </div>
              <div class="w-full h-1 rounded-full overflow-hidden bg-white/8">
                <div class="h-full rounded-full transition-[width] duration-500" style="width: 32%; background: linear-gradient(90deg, rgba(16,185,129,0.5), var(--dt-state-success)); box-shadow: 0 0 6px rgba(16,185,129,0.45);"></div>
              </div>
            </div>
            <div>
              <div class="flex justify-between items-center mb-1">
                <span class="text-[11px] text-white/50">内存</span>
                <span class="text-[11px] text-white/70 tabular-nums">67%</span>
              </div>
              <div class="w-full h-1 rounded-full overflow-hidden bg-white/8">
                <div class="h-full rounded-full transition-[width] duration-500" style="width: 67%; background: linear-gradient(90deg, rgba(245,158,11,0.5), var(--dt-state-warning)); box-shadow: 0 0 6px rgba(245,158,11,0.45);"></div>
              </div>
            </div>
            <div>
              <div class="flex justify-between items-center mb-1">
                <span class="text-[11px] text-white/50">磁盘</span>
                <span class="text-[11px] text-white/70 tabular-nums">62%</span>
              </div>
              <div class="w-full h-1 rounded-full overflow-hidden bg-white/8">
                <div class="h-full rounded-full transition-[width] duration-500" style="width: 62%; background: linear-gradient(90deg, rgba(108,92,231,0.5), var(--dt-primary)); box-shadow: 0 0 6px rgba(108,92,231,0.45);"></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- ========== Desktop Context Hint (bottom-right, above taskbar) ========== -->
      <div class="absolute bottom-14 right-4 z-10 flex flex-col items-end gap-0.5">
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 rounded-sm flex items-center justify-center" style="background: var(--dt-primary); opacity: 0.6;">
            <i data-lucide="monitor" class="w-2.5 h-2.5 text-white"></i>
          </div>
          <span class="text-[10px] text-white/25 font-light">zDesktop v1.0</span>
        </div>
        <span class="text-[9px] text-white/15 font-light pr-1">点击右键打开菜单</span>
      </div>

      <!-- ========== Taskbar (fixed bottom, Windows 11 style) ========== -->
      <div class="absolute bottom-0 left-0 right-0 z-50">
        <div class="mx-2 mb-1.5 h-11 flex items-center px-2 rounded-xl bg-black/50 border border-white/[0.06]" style="backdrop-filter: blur(48px) saturate(1.8); box-shadow: 0 -2px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);">

          <!-- Left: Start, Search, Task View -->
          <div class="flex items-center gap-0.5">
            <!-- Start Button with Windows-style 4-square grid -->
            <div class="w-9 h-9 rounded-lg flex items-center justify-center hover:bg-white/10 cursor-pointer transition-colors" title="开始菜单">
              <div class="grid grid-cols-2 gap-0.5 w-4 h-4">
                <div class="rounded-[1px]" style="background: var(--dt-primary);"></div>
                <div class="rounded-[1px]" style="background: var(--dt-primary);"></div>
                <div class="rounded-[1px]" style="background: var(--dt-primary);"></div>
                <div class="rounded-[1px]" style="background: var(--dt-primary);"></div>
              </div>
            </div>
            <!-- Search -->
            <div data-dom-id="nav-global-search" class="w-9 h-9 rounded-lg flex items-center justify-center hover:bg-white/10 cursor-pointer transition-colors" title="搜索">
              <i data-lucide="search" class="w-[18px] h-[18px] text-white/70"></i>
            </div>
            <!-- Task View -->
            <div class="w-9 h-9 rounded-lg flex items-center justify-center hover:bg-white/10 cursor-pointer transition-colors" title="任务视图">
              <i data-lucide="copy" class="w-[18px] h-[18px] text-white/70"></i>
            </div>
          </div>

          <!-- Center: Pinned App Icons -->
          <div class="flex-1 flex items-center justify-center gap-1">
            <div class="w-10 h-10 rounded-lg flex items-center justify-center hover:bg-white/10 cursor-pointer transition-colors relative" title="文件资源管理器">
              <i data-lucide="folder" class="w-5 h-5 text-white/70"></i>
            </div>
            <div class="w-10 h-10 rounded-lg flex items-center justify-center hover:bg-white/10 cursor-pointer transition-colors relative" title="浏览器">
              <i data-lucide="globe" class="w-5 h-5 text-white/70"></i>
            </div>
            <!-- VS Code — active, with elevated highlight -->
            <div class="w-10 h-10 rounded-lg flex items-center justify-center cursor-pointer transition-colors relative" title="Visual Studio Code" style="background: rgba(59,130,246,0.18); box-shadow: 0 0 12px rgba(59,130,246,0.12), inset 0 1px 0 rgba(255,255,255,0.06);">
              <i data-lucide="code" class="w-5 h-5" style="color: #60a5fa;"></i>
              <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-5 h-[3px] rounded-full" style="background: #60a5fa; box-shadow: 0 0 6px rgba(96,165,250,0.5);"></div>
            </div>
            <!-- Terminal — active -->
            <div class="w-10 h-10 rounded-lg flex items-center justify-center cursor-pointer transition-colors relative" title="终端" style="background: rgba(16,185,129,0.18); box-shadow: 0 0 12px rgba(16,185,129,0.12), inset 0 1px 0 rgba(255,255,255,0.06);">
              <i data-lucide="terminal-square" class="w-5 h-5" style="color: var(--dt-state-success);"></i>
              <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-5 h-[3px] rounded-full" style="background: var(--dt-state-success); box-shadow: 0 0 6px rgba(16,185,129,0.5);"></div>
            </div>
            <!-- zDesktop — active, brand highlight -->
            <div class="w-10 h-10 rounded-lg flex items-center justify-center cursor-pointer transition-colors relative" title="zDesktop" style="background: rgba(108,92,231,0.28); box-shadow: 0 0 16px rgba(108,92,231,0.22), inset 0 1px 0 rgba(255,255,255,0.08);">
              <i data-lucide="monitor" class="w-5 h-5" style="color: var(--dt-primary);"></i>
              <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-5 h-[3px] rounded-full" style="background: var(--dt-primary); box-shadow: 0 0 6px rgba(108,92,231,0.55);"></div>
            </div>
            <!-- 图标管理 (Icon Manager) -->
            <div class="w-10 h-10 rounded-lg flex items-center justify-center hover:bg-white/10 cursor-pointer transition-colors relative" title="图标管理">
              <i data-lucide="palette" class="w-5 h-5" style="color: var(--dt-state-warning);"></i>
            </div>
          </div>

          <!-- Right: System Tray -->
          <div class="flex items-center gap-2">
            <div class="flex items-center gap-1.5 px-1.5 py-1 rounded-md hover:bg-white/10 cursor-pointer transition-colors" title="网络 · 音量 · 电池">
              <i data-lucide="wifi" class="w-[14px] h-[14px] text-white/60"></i>
              <i data-lucide="volume-2" class="w-[14px] h-[14px] text-white/60"></i>
              <i data-lucide="battery-medium" class="w-[14px] h-[14px] text-white/60"></i>
            </div>
            <div class="px-2.5 py-1 rounded-md hover:bg-white/10 cursor-pointer transition-colors text-right leading-none" title="日期和时间">
              <div class="text-[11px] text-white/75 tabular-nums tracking-tight">14:32:08</div>
              <div class="text-[10px] text-white/45 tabular-nums mt-0.5">2025/7/22</div>
            </div>
            <!-- Settings -->
            <div data-dom-id="nav-settings" class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-white/10 cursor-pointer transition-colors" title="设置">
              <i data-lucide="settings" class="w-4 h-4 text-white/60"></i>
            </div>
            <!-- Quit / Exit -->
            <div class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-red-500/20 cursor-pointer transition-colors group" title="退出">
              <i data-lucide="log-out" class="w-4 h-4 text-white/40 group-hover:text-red-400 transition-colors"></i>
            </div>
            <!-- Show Desktop (Windows-style thin sliver) -->
            <div class="w-2 h-9 flex items-center justify-center hover:bg-white/10 cursor-pointer transition-colors rounded-sm" title="显示桌面">
              <div class="w-[2px] h-6 bg-white/20"></div>
            </div>
          </div>

        </div>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
